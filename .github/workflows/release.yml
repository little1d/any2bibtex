name: Release any2bibtex

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.0.7
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run release:check -- "$RELEASE_TAG"
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: cargo check --locked
        working-directory: src-tauri

  build-windows:
    needs: validate
    runs-on: windows-2025
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run release:check -- "$env:RELEASE_TAG"

      - name: Configure Windows signing
        shell: pwsh
        run: |
          $signingValues = @(
            $env:AZURE_CLIENT_ID,
            $env:AZURE_CLIENT_SECRET,
            $env:AZURE_TENANT_ID,
            $env:AZURE_SIGNING_ENDPOINT,
            $env:AZURE_SIGNING_ACCOUNT,
            $env:AZURE_SIGNING_PROFILE
          )
          $configuredValues = @($signingValues | Where-Object { $_ })
          if ($configuredValues.Count -ne 0 -and $configuredValues.Count -ne $signingValues.Count) {
            throw "Azure Artifact Signing is only partially configured."
          }

          $config = @{ bundle = @{ createUpdaterArtifacts = $true } }
          if ($configuredValues.Count -eq $signingValues.Count) {
            cargo install artifact-signing-cli --locked
            $command = "artifact-signing-cli -e $env:AZURE_SIGNING_ENDPOINT -a $env:AZURE_SIGNING_ACCOUNT -c $env:AZURE_SIGNING_PROFILE -d any2bibtex %1"
            $config.bundle.windows = @{ signCommand = $command }
          } else {
            Write-Warning "Azure Artifact Signing is not configured; building an unsigned Windows installer."
          }

          $config | ConvertTo-Json -Depth 4 | Set-Content src-tauri/tauri.ci.conf.json

      - name: Build Windows installer
        run: npx tauri build --config src-tauri/tauri.ci.conf.json --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Stage Windows artifacts
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart("v")
          $bundle = "src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem $bundle -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows NSIS installer was not generated." }
          New-Item -ItemType Directory -Force -Path release-files | Out-Null
          $destination = "release-files/any2bibtex_${version}_x64-setup.exe"
          Copy-Item $installer.FullName $destination
          Copy-Item "$($installer.FullName).sig" "$destination.sig"

      - uses: actions/upload-artifact@v4
        with:
          name: any2bibtex-windows-x64
          path: release-files/*
          if-no-files-found: error
          retention-days: 7

  build-macos:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_PRIVATE_KEY: ${{ secrets.APPLE_API_KEY_PRIVATE_KEY }}
      APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci
      - run: npm run release:check -- "$RELEASE_TAG"

      - name: Configure Apple signing and notarization
        shell: bash
        run: |
          api_credentials=0
          apple_id_credentials=0
          for value in "$APPLE_API_ISSUER" "$APPLE_API_KEY" "$APPLE_API_KEY_PRIVATE_KEY"; do
            [[ -n "$value" ]] && ((api_credentials += 1))
          done
          for value in "$APPLE_ID" "$APPLE_PASSWORD" "$APPLE_TEAM_ID"; do
            [[ -n "$value" ]] && ((apple_id_credentials += 1))
          done

          if [[ "$api_credentials" -ne 0 && "$api_credentials" -ne 3 ]]; then
            echo "App Store Connect API credentials are only partially configured." >&2
            exit 1
          fi
          if [[ "$apple_id_credentials" -ne 0 && "$apple_id_credentials" -ne 3 ]]; then
            echo "Apple ID notarization credentials are only partially configured." >&2
            exit 1
          fi

          signing_enabled=false
          if [[ -n "$APPLE_CERTIFICATE" || -n "$APPLE_SIGNING_IDENTITY_SECRET" ]]; then
            if [[ -z "$APPLE_CERTIFICATE" || -z "$APPLE_CERTIFICATE_PASSWORD" || -z "$APPLE_SIGNING_IDENTITY_SECRET" ]]; then
              echo "Apple signing is only partially configured." >&2
              exit 1
            fi

            certificate_path="$RUNNER_TEMP/apple-certificate.p12"
            if printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path" &&
              (openssl pkcs12 -in "$certificate_path" -passin "pass:$APPLE_CERTIFICATE_PASSWORD" -noout >/dev/null 2>&1 ||
                openssl pkcs12 -legacy -in "$certificate_path" -passin "pass:$APPLE_CERTIFICATE_PASSWORD" -noout >/dev/null 2>&1); then
              signing_enabled=true
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY_SECRET" >> "$GITHUB_ENV"
            else
              echo "::warning::Apple certificate validation failed; using ad-hoc signing."
            fi
          else
            echo "::warning::Apple signing is not configured; using ad-hoc signing."
          fi

          if [[ "$signing_enabled" != true ]]; then
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_PRIVATE_KEY APPLE_API_KEY_PATH; do
              echo "$name=" >> "$GITHUB_ENV"
            done
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi

          if [[ "$signing_enabled" == true && "$api_credentials" -eq 3 ]]; then
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            printf '%s' "$APPLE_API_KEY_PRIVATE_KEY" > "$key_path"
            chmod 600 "$key_path"
            echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          fi

      - name: Build macOS bundle
        shell: bash
        run: |
          build_ad_hoc() {
            env \
              -u APPLE_CERTIFICATE \
              -u APPLE_CERTIFICATE_PASSWORD \
              -u APPLE_ID \
              -u APPLE_PASSWORD \
              -u APPLE_TEAM_ID \
              -u APPLE_API_ISSUER \
              -u APPLE_API_KEY \
              -u APPLE_API_KEY_PRIVATE_KEY \
              -u APPLE_API_KEY_PATH \
              APPLE_SIGNING_IDENTITY=- \
              npm run build:release -- --target ${{ matrix.target }} --bundles app,dmg
          }

          if [[ "$APPLE_SIGNING_IDENTITY" == "-" ]]; then
            build_ad_hoc
          elif ! npm run build:release -- --target ${{ matrix.target }} --bundles app,dmg; then

            echo "::warning::Apple signing failed; retrying with ad-hoc signing."
            build_ad_hoc
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Stage macOS artifacts
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          archive="$(find "$bundle/macos" -maxdepth 1 -name '*.app.tar.gz' -print -quit)"
          dmg="$(find "$bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$archive" && test -n "$dmg"
          mkdir -p release-files
          destination="release-files/any2bibtex_${version}_${{ matrix.arch }}.app.tar.gz"
          cp "$archive" "$destination"
          cp "$archive.sig" "$destination.sig"
          cp "$dmg" "release-files/any2bibtex_${version}_${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: any2bibtex-macos-${{ matrix.arch }}
          path: release-files/*
          if-no-files-found: error
          retention-days: 7

  build-linux:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            arch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci
      - run: npm run release:check -- "$RELEASE_TAG"

      - name: Build Linux bundles
        run: npm run build:release -- --target ${{ matrix.target }} --bundles appimage,deb
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Stage Linux artifacts
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          appimage="$(find "$bundle/appimage" -maxdepth 1 -name '*.AppImage' -print -quit)"
          deb="$(find "$bundle/deb" -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$appimage" && test -n "$deb"
          mkdir -p release-files
          destination="release-files/any2bibtex_${version}_${{ matrix.arch }}.AppImage"
          cp "$appimage" "$destination"
          cp "$appimage.sig" "$destination.sig"
          cp "$deb" "release-files/any2bibtex_${version}_${{ matrix.arch }}.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: any2bibtex-linux-${{ matrix.arch }}
          path: release-files/*
          if-no-files-found: error
          retention-days: 7

  create-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          pattern: any2bibtex-*
          path: release-files
          merge-multiple: true

      - name: Create updater manifest
        run: npm run release:manifest
        env:
          RELEASE_VERSION: ${{ env.RELEASE_TAG }}

      - name: Create checksums
        run: |
          cd release-files
          sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: any2bibtex ${{ env.RELEASE_TAG }}
          body_path: release-files/release-notes.md
          files: release-files/*
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
